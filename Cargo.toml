[package]
name = "vc"
version = "0.1.0"
edition = "2021"
description = "Async VPN config fetcher: downloads subscription files, base64-decodes when needed, saves to output/N.txt"
license = "MIT"
default-run = "vc"

[[bin]]
name = "vc"
path = "src/main.rs"

[lib]
name = "vc"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
ua_generator = "0.5"

[dev-dependencies]
tempfile = "3"
