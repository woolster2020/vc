name: Update VPN configs

on:
  schedule:
    # Запуск каждые 2 часа (в 00:00, 02:00, 04:00 и т.д. по UTC).
    - cron: "0 */2 * * *"
  
  push:
    branches: [ main, master ]
    # Запускать по push, только если изменения не касаются папки с конфигами.
    # Это полностью защищает от бесконечного цикла.
    paths-ignore:
      - 'output/**'
  
  # Оставляем возможность запустить экшен вручную одной кнопкой в UI.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Автоматическое кэширование зависимостей и собранного бинарника.
      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      # Кэш подхватит скомпилированный бинарник, и этот шаг займет секунды.
      - name: Fetch configs
        run: cargo run --release

      - name: Commit and push updated configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Индексируем только изменения в папке с результатами.
          git add output/
          
          # Проверяем, изменилось ли что-то.
          if git diff --cached --quiet; then
            echo "No changes in output/. Skipping commit."
          else
            # [skip ci] — дополнительная защита, чтобы коммит не вызывал другие проверки
            git commit -m "chore: update VPN configs [skip ci]"
            
            # Актуализируем ветку перед push на случай параллельных изменений.
            git pull --rebase origin ${GITHUB_REF##*/}
            git push
          fi
