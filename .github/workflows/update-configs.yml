name: Update VPN configs

on:
  schedule:
    # Запуск примерно через каждый час.
    - cron: "0 */1 * * *"
  
  push:
    branches: [ main, master ]
    # Запускать по push, только если изменения не касаются папки с конфигами.
    # Это полностью защищает от бесконечного цикла.
    paths-ignore:
      - 'output/**'
  
  # Оставляем возможность запустить экшен вручную одной кнопкой в UI.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Полная история: пуш в зеркала из shallow-клона ненадёжен.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Автоматическое кэширование зависимостей и собранного бинарника.
      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      # Кэш подхватит скомпилированный бинарник, и этот шаг займет секунды.
      - name: Fetch configs
        run: cargo run --release

      - name: Commit and push updated configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Индексируем только изменения в папке с результатами.
          # -A: stage-ит и новые части `{id}-{n}.txt`, индексы
          # `github_/gitlab_/codeberg_/gitea_urls.txt`, и удаления
          # (исходные большие `{id}.txt`, устаревшие хвосты сплита).
          git add -A output/
          
          # Проверяем, изменилось ли что-то.
          if git diff --cached --quiet; then
            echo "No changes in output/. Skipping commit."
          else
            # [skip ci] — дополнительная защита, чтобы коммит не вызывал другие проверки
            git commit -m "chore: update VPN configs [skip ci]"
            
            # Актуализируем ветку перед push на случай параллельных изменений.
            git pull --rebase origin ${GITHUB_REF##*/}
            git push
          fi

      # Зеркала получают ту же ветку целиком (вместе с output/ и *_urls.txt).
      # Шаг идемпотентен: без изменений push — no-op, ранее упавший пуш — долечится.
      # Падение одного зеркала (например, 503 от Codeberg) не прерывает остальные:
      # ошибки копятся и роняют шаг только в самом конце.
      - name: Push output to mirrors
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF##*/}"
          FAILED=""

          # Пуш в одно зеркало с ретраями против транзиентных 5xx.
          # $1 — имя remote, $2 — URL remote (токен уже подставлен).
          # Всегда возвращает 0, неуспех дописывает имя в $FAILED.
          mirror_push() {
            local name="$1" url="$2" attempt=0
            while [ "$attempt" -lt 3 ]; do
              attempt=$((attempt + 1))
              git remote remove "$name" 2>/dev/null || true
              git remote add "$name" "$url"
              if git push "$name" "HEAD:${BRANCH}"; then
                return 0
              fi
              echo "Push to $name failed (attempt $attempt/3)."
              sleep $((attempt * 30))
            done
            FAILED="${FAILED} ${name}"
            return 0
          }

          # Пустой токен — пропуск зеркала, чтобы ручные запуски
          # без секретов не падали. Токены в логах маскируются GitHub.
          if [ -n "$GITLAB_TOKEN" ]; then
            mirror_push gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/woolster2020/vc.git"
          else
            echo "Skipping GitLab mirror: GITLAB_TOKEN is empty."
          fi

          if [ -n "$CODEBERG_TOKEN" ]; then
            mirror_push codeberg "https://woolster2020:${CODEBERG_TOKEN}@codeberg.org/woolster2020/vc.git"
          else
            echo "Skipping Codeberg mirror: CODEBERG_TOKEN is empty."
          fi

          if [ -n "$GITEA_TOKEN" ]; then
            mirror_push gitea "https://woolster2020:${GITEA_TOKEN}@gitea.com/woolster2020/vc.git"
          else
            echo "Skipping Gitea mirror: GITEA_TOKEN is empty."
          fi

          if [ -n "$FAILED" ]; then
            echo "Mirror push failed for:$FAILED"
            exit 1
          fi
          echo "All mirrors pushed."
